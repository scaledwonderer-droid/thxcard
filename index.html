<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="対話店のお礼SSを、ブラウザだけで簡単に作れるカードジェネレーター。">
    <meta name="color-scheme" content="dark">
    <title>お礼SSカードジェネレーター</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css?v=20260820-3">
    <script src="./templates/templates.js?v=20260820-3" defer></script>
    <script src="./app.js?v=20260820-3" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true"><span>✦</span></div>
        <div class="brand-copy">
          <p>Dialogue shop tools</p>
          <h1>お礼SSカードジェネレーター</h1>
        </div>
        <div class="privacy-pill"><span class="privacy-dot"></span>画像は外部送信されません</div>
      </header>

      <div class="workspace">
        <section class="preview-column" aria-label="カードプレビュー">
          <div class="preview-heading">
            <div>
              <span class="eyebrow">Live preview</span>
              <h2 id="template-name">リネン・ノート</h2>
            </div>
            <div class="size-badge" id="size-badge">1200 × 1500px</div>
          </div>
          <div class="canvas-stage canvas-simple" id="canvas-stage">
            <canvas
              id="card-canvas"
              width="1200"
              height="1500"
              aria-label="完成画像プレビュー。SS、文字、メッセージボックスをドラッグして移動できます"
            ></canvas>
          </div>
          <div class="gesture-hint">
            <span><i class="drag-icon"></i>SS・文字・本文ボックスをドラッグ</span>
            <span><i class="wheel-icon"></i>SS上のホイールで拡大縮小</span>
          </div>
        </section>

        <aside class="editor-panel" aria-label="編集パネル">
          <details class="panel-section" open>
            <summary><span class="step-number">01</span><span>テンプレート</span><i></i></summary>
            <div class="section-body">
              <div class="template-grid" id="template-grid"></div>
              <p class="template-description" id="template-description"></p>
            </div>
          </details>

          <details class="panel-section" open>
            <summary><span class="step-number">02</span><span>SS</span><i></i></summary>
            <div class="section-body">
              <div class="slot-tabs" id="slot-tabs" role="tablist" aria-label="編集するSS" hidden></div>
              <label class="upload-control">
                <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp">
                <span class="upload-icon">＋</span>
                <span>
                  <strong id="upload-label">SSを読み込む</strong>
                  <small>PNG・JPG・WebP</small>
                </span>
              </label>
              <p class="file-name" id="file-name" hidden></p>
              <label class="range-control">
                <span>倍率</span>
                <strong id="scale-output">100%</strong>
                <input id="scale-input" type="range" min="50" max="300" step="1" value="100">
              </label>
              <label class="range-control">
                <span>回転</span>
                <strong id="rotation-output">0°</strong>
                <input id="rotation-input" type="range" min="-15" max="15" step="1" value="0">
              </label>
              <button class="subtle-button" id="image-reset" type="button">SSの位置・倍率・回転をリセット</button>
              <div class="frame-controls" id="frame-controls" hidden>
                <label class="toggle-row frame-toggle">
                  <span><strong>フレームを使用する</strong><small>SSの上・文字の下に重ねます</small></span>
                  <input id="frame-enabled" type="checkbox">
                  <i aria-hidden="true"></i>
                </label>
                <div class="frame-picker" id="frame-picker" hidden>
                  <div class="frame-picker-heading"><span>フレーム選択</span><strong id="frame-name">シャンパンゴールド</strong></div>
                  <div class="frame-grid" id="frame-grid" role="listbox" aria-label="使用するフレーム"></div>
                </div>
              </div>
            </div>
          </details>

          <details class="panel-section" open>
            <summary><span class="step-number">03</span><span>メッセージ</span><i></i></summary>
            <div class="section-body message-fields">
              <label>
                <span>宛名 <small>入力時のみ「へ」を自動追加</small></span>
                <input id="recipient-input" type="text" placeholder="にゃーちゃん" autocomplete="off">
              </label>
              <label>
                <span>本文 <small>メッセージボックス内で自動折り返し</small></span>
                <textarea id="body-input" rows="5"></textarea>
              </label>
              <label>
                <span>署名 <small>入力時のみ「より」を自動追加</small></span>
                <input id="signature-input" type="text" placeholder="鱗の旅人" autocomplete="off">
              </label>
              <label>
                <span>英字見出し <small>任意</small></span>
                <input id="headline-input" type="text" placeholder="Thank You" autocomplete="off">
              </label>
              <label class="toggle-row">
                <span>
                  <strong>メッセージ背景</strong>
                  <small>本文ボックスの背景だけを表示／非表示</small>
                </span>
                <input id="message-background" type="checkbox">
                <i aria-hidden="true"></i>
              </label>
              <div class="message-box-controls">
                <button class="subtle-button select-message-button" id="select-message-box" type="button">本文ボックスを選択</button>
                <p>選択後、枠内のどこをドラッグしても移動できます。背景OFFでも有効です。</p>
                <label class="field-label">
                  <span>形状</span>
                  <select id="message-shape"><option value="rectangle">長方形</option><option value="rounded">角丸長方形</option></select>
                </label>
                <label class="range-control">
                  <span>横位置</span>
                  <strong id="message-x-output">140px</strong>
                  <input id="message-x" type="range" min="0" max="280" step="1" value="140">
                </label>
                <label class="range-control">
                  <span>縦位置</span>
                  <strong id="message-y-output">1115px</strong>
                  <input id="message-y" type="range" min="0" max="1280" step="1" value="1115">
                </label>
                <label class="range-control">
                  <span>横幅</span>
                  <strong id="message-width-output">920px</strong>
                  <input id="message-width" type="range" min="220" max="1200" step="1" value="920">
                </label>
                <label class="range-control">
                  <span>高さ</span>
                  <strong id="message-height-output">220px</strong>
                  <input id="message-height" type="range" min="120" max="1500" step="1" value="220">
                </label>
                <label class="color-control">
                  <span>背景色</span>
                  <input id="message-color" type="color" value="#555257">
                  <output id="message-color-output">#555257</output>
                </label>
                <label class="range-control">
                  <span>透明度</span>
                  <strong id="message-opacity-output">22%</strong>
                  <input id="message-opacity" type="range" min="5" max="90" step="1" value="22">
                </label>
              </div>
            </div>
          </details>

          <details class="panel-section" open>
            <summary><span class="step-number">04</span><span>文字設定</span><i></i></summary>
            <div class="section-body">
              <div class="text-tabs" id="text-tabs" role="tablist" aria-label="編集する文字">
                <button type="button" data-text-key="recipient">宛名</button>
                <button type="button" data-text-key="body" class="active">本文</button>
                <button type="button" data-text-key="signature">署名</button>
                <button type="button" data-text-key="headline">英字見出し</button>
              </div>
              <label class="field-label">
                <span>フォント</span>
                <select id="font-select"></select>
              </label>
              <label class="range-control">
                <span>文字サイズ</span>
                <strong id="font-size-output">33px</strong>
                <input id="font-size-input" type="range" min="18" max="110" step="1" value="33">
              </label>
              <label class="color-control">
                <span>文字色</span>
                <input id="color-input" type="color" value="#312d34">
                <output id="color-output">#312D34</output>
              </label>
              <div class="align-control" id="align-control" aria-label="文字揃え">
                <span>文字揃え</span>
                <button type="button" data-align="left" aria-label="左揃え">≡</button>
                <button type="button" data-align="center" class="active" aria-label="中央揃え">☰</button>
                <button type="button" data-align="right" aria-label="右揃え">≡</button>
              </div>
            </div>
          </details>

          <div class="export-panel">
            <div><span>PNG出力</span><strong id="export-size">1200 × 1500px</strong></div>
            <button id="export-button" type="button">
              <span>PNGで保存</span><i aria-hidden="true">↓</i>
            </button>
            <p>選択枠やガイドは保存画像に含まれません</p>
          </div>
        </aside>
      </div>
      <footer>画像と文章の処理は、このブラウザ内だけで完結します。</footer>
    </main>

    <noscript>このツールを使用するには、ブラウザのJavaScriptを有効にしてください。</noscript>
  </body>
</html>
